name: WallCanvas
version: '${version}'
main: com.ultraop.wallcanvas.paper.WallCanvasPaper
api-version: '1.21.11'
authors: [UltraOP]
description: Server-side custom wall art and map displays.
commands:
  wallcanvas:
    description: WallCanvas picture library, painting and map display commands.
    usage: /wallcanvas <list|info|create|give|map> ...
    permission: wallcanvas.use
permissions:
  wallcanvas.use:
    description: Use WallCanvas commands.
    default: op
