name: Build WallCanvas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Core, Fabric and Paper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build all modules
        run: gradle build --no-daemon

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wallcanvas-builds
          path: |
            wallcanvas-core/build/libs/*.jar
            wallcanvas-fabric/build/libs/*.jar
            wallcanvas-paper/build/libs/*.jar
          if-no-files-found: error
